# Model registry. VRAM figures measured on RTX 5070 Laptop (8 GB) at num_ctx 8192.
# 7B + 4B do not fit together, so the scheduler swaps one model at a time.
# keep_alive: how long Ollama keeps a model resident after its last request (the scheduler unloads explicitly when it needs the room).
# router: which model each employee uses (see backend/app/router.py). With no benchmark evidence every role runs on `safe_default`
# (the model every full build has been proven on); another model takes a role only when it beats the default's pass rate by `margin`
# over at least `min_runs` benchmark runs. `pins` fix a role to a model whatever the scores say, with the reason shown on the leaderboard.
router:
  safe_default: qwen25-coder-7b
  margin: 0.1
  min_runs: 2
  pins: {}
  note: >-
    Why every role runs on qwen2.5-coder:7b: no other model beat it by the margin. qwen3:4b ties it on Database and Frontend and is close on Backend,
    but fails the Planner (0 of 4) and QA triage (2 of 8); llama3.2:3b fails every engineering task. Swapping models also costs time: a build with the
    Reviewer on qwen3:4b passed but took 233 s (8 model swaps) against about 120 s on the 7B alone, because each swap is a model load and the GPU
    serves one model at a time. qwen2.5-coder:14b (partial offload, about 5.7 GB VRAM + 4.3 GB RAM, 12 tokens/s) and qwen2.5-coder:32b (5.8 GB VRAM + 14.9 GB RAM, 3.9 tokens/s) tie the 7B on Architect, Reviewer, QA triage and the Task C analyst, so they stay off those roles (the 32B's Architect runs hit Ollama's 300 s call limit). The one exception the margin rule makes is the Task C finish engineer: 32B 1 of 2 (the other run hit the 10 minute task limit) against the 7B's 1 of 4, which is thin evidence at about 7 minutes per gap; pin it back with `pins: {finish: {model: qwen25-coder-7b, reason: ...}}` if that is not wanted. A different model can still be chosen per employee in the inspector.
keep_alive: 60m
models:
  - id: qwen25-coder-7b
    provider: ollama
    name: qwen2.5-coder:7b
    capabilities: [coding, frontend, sql]
    num_ctx: 8192
    vram_gb: 4.7
    enabled: true
  - id: qwen3-4b
    provider: ollama
    name: qwen3:4b
    capabilities: [reasoning, review]
    num_ctx: 8192
    vram_gb: 3.6
    enabled: true
  - id: llama32-3b
    provider: ollama
    name: llama3.2:3b
    capabilities: [reasoning, review]
    num_ctx: 8192
    vram_gb: 2.5
    enabled: true
  # Partial offload (8 GB VRAM + 32 GB RAM): Ollama puts as many layers on the GPU as fit and keeps the rest in system RAM. vram_gb / ram_gb are measured
  # at num_ctx 8192 (scripts/model_perf.py, backend/benchmarks/model_perf.json). The scheduler never loads one of these next to another model.
  - id: qwen25-coder-14b
    provider: ollama
    name: qwen2.5-coder:14b
    capabilities: [coding, frontend, sql, reasoning, review]
    num_ctx: 8192
    vram_gb: 5.7
    ram_gb: 4.3
    keep_alive: 5m
    enabled: true
  - id: qwen25-coder-32b
    provider: ollama
    name: qwen2.5-coder:32b
    capabilities: [coding, frontend, sql, reasoning, review]
    num_ctx: 8192
    vram_gb: 5.8
    ram_gb: 14.9
    keep_alive: 5m
    enabled: true
  # Cloud entries: effective only when `requires_env` is set (see registry.py).
  # gemini-2.5-flash is no longer served to new keys; 3.8-flash is the primary.
  - id: gemini-flash
    provider: gemini
    name: gemini-3.8-flash
    capabilities: [coding, frontend, sql, reasoning, review]
    num_ctx: 32768
    vram_gb: 0
    enabled: true
    requires_env: GEMINI_API_KEY
    fallback: gemini-flash-lite
  - id: gemini-flash-lite
    provider: gemini
    name: gemini-3.1-flash-lite
    capabilities: [coding, frontend, sql, reasoning, review]
    num_ctx: 32768
    vram_gb: 0
    enabled: true
    requires_env: GEMINI_API_KEY
  - id: groq-llama
    provider: openai_compat
    name: llama-3.3-70b-versatile
    capabilities: [coding, frontend, sql, reasoning, review]
    num_ctx: 32768
    vram_gb: 0
    enabled: true
    requires_env: OPENAI_COMPAT_API_KEY
