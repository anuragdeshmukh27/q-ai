name: social
title: Social and community
summary: People share posts and talk about them.
keywords: [social, community, forum, blog, post, posts, comment, comments, instagram, twitter, reddit, facebook, feed, follower, followers, like, likes, share, thread, threads, discussion, question, questions, answer, answers, youtube, video, videos, tweet, tweets, article, articles, news]
icon: "💬"
icons: {posts: "📝", comments: "💬", questions: "❓", answers: "✅", videos: "▶️", replies: "↩️", articles: "📰"}
skin: community
currency: INR
modules:
  - {name: posts, fields: "title, content, author, likes integer"}
  - {name: comments, parent: posts, fields: "content, author"}
rules:
  - {field: "email", rule: email}
kpis:
  - {label: "Posts", resource: posts, agg: count}
  - {label: "Comments", resource: comments, agg: count}
  - {label: "Likes", resource: posts, agg: sum, field: likes}
  - {label: "Upvotes", resource: posts, agg: sum, field: upvotes}
charts:
  - {title: "Comments per post", resource: comments, per: parent}
