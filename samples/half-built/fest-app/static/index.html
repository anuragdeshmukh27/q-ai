<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fest app</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    li { margin: .3rem 0; }
    .stats { color: #555; }
  </style>
</head>
<body>
  <h1>Fest app</h1>
  <p class="stats" id="stats"></p>
  <form id="event-form">
    <input id="name" placeholder="Event name" required>
    <input id="venue" placeholder="Venue" required>
    <button type="submit">Add event</button>
  </form>
  <ul id="events"></ul>
  <h2>Sponsors</h2>
  <ul id="sponsors"></ul>
  <script src="/static/app.js"></script>
</body>
</html>
